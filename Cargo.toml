[package]
name = "ssh_ca_server"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive"] }
duration-str = "0.17.0"
env_logger = "0.11.8"
log = "0.4.27"
minijinja = "2.16.0"
nix = {version="0.30.1", features= ["process", "user", "socket"]}
pam = "0.8"
rand = "0.9.1"
#russh = {version="0.52.1", features=["async-trait"]}
# Audited commit: cfe5d8a99d5dd57fcef927f2ea8bbf7ba26ceef4 — pinned via Cargo.lock.
# Before running `cargo update`, review changes at https://github.com/gvz/russh.git
russh = {git = "https://github.com/gvz/russh.git", features=["async-trait"]}
russh-keys = "0.49.2"
serde = {version="1.0.219", features=["derive"]}
serde_json = {version="1.0.140"}
ssh-key = {version="0.6.7", features=["ed25519", "serde"]}
thiserror = "2.0.12"
tokio = {version="1.45.1",features=["full"]}
toml = "0.8.23"
humantime = "2.1.0"
async-trait = "0.1.88"
tempfile = "3.10.1"
arbitrary = { version = "1.4.2", optional = true, features = ["derive"] }
ed25519-dalek = { version = "2.1.1", optional = true, features = ["serde"] }
glob = "0.3.3"
zeroize = "1.8.2"
subtle = "2.6"


[features]
test_auth =[]
arbitrary = ["dep:arbitrary", "dep:ed25519-dalek"]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]

[package.metadata.deb]
name = "ssh-ca-server"
maintainer = "SSH CA Server Contributors"
copyright = "2024, SSH CA Server Contributors"
extended-description = "SSH Certificate Authority server daemon"
# libpam0g is loaded via dlopen at runtime (not DT_NEEDED), so $auto won't detect it;
# the explicit entry is required.
depends = "$auto, libpam0g"
section = "net"
priority = "optional"
assets = [
  ["target/release/ssh_ca_server", "usr/bin/ssh-ca-server", "755"],
  ["config/config.toml", "etc/ssh-ca-server/config.toml.example", "644"],
]

[package.metadata.deb.variants.client]
name = "ssh-ca-client"
extended-description = "Client scripts for SSH Certificate Authority certificate signing"
depends = "openssh-client"
assets = [
  ["clients/ssh-ca-sign-user-key.sh", "usr/bin/ssh-ca-sign-user-key", "755"],
  ["clients/ssh-ca-sign-host-key.sh", "usr/bin/ssh-ca-sign-host-key", "755"],
]
