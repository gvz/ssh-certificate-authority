# Example configuration. See book/src/server-setup.md.
# Relative paths are resolved against the directory of this file.

[ssh]
bind = "0.0.0.0"
port = 2222
# Host key of the CA server itself. Not the CA signing key.
private_key = "/etc/ssh_ca_server/ssh_ca_host_ed25519_key"
# Host certificate of the CA server. Uncomment after signing the host key.
#certificate = "/etc/ssh_ca_server/ssh_ca_host_ed25519_key-cert.pub"

[ca]
# Key that signs user and host certificates. Keep it private, mode 600.
ca_key = "/etc/ssh_ca_server/ca_key"
# Maps users to their certificate template.
user_list_file = "/etc/ssh_ca_server/user.toml"
# Template used for users that are not listed in user_list_file.
default_user_template = "/etc/ssh_ca_server/user_default.toml"
# Directory with one TOML file per enrolled host.
host_inventory = "/etc/ssh_ca_server/hosts/"

[identity_handlers]
user_authenticators = [
  "pam",
]
