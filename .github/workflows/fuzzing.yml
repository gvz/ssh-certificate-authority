name: "Fuzzing (10min) and Pages"

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fuzzing_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
      - name: run fuzzing
        run: nix develop --command ./scripts/fuzz-all.sh -d 600
      - name: generate shell coverage report
        run: nix develop --command ./scripts/fuzz-coverage.sh --shell
      - name: generate HTML coverage report
        run: nix develop --command ./scripts/fuzz-coverage.sh --html
      - name: upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage-report
          path: fuzz/coverage/report/

  # Publishes the whole Pages site: the user guide at the root, the fuzz
  # coverage report under /fuzz-coverage/. Both live in one deployment,
  # because GitHub Pages serves a single artifact per site.
  publish_site:
    needs: fuzzing_test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
      - name: build user guide
        run: nix develop --command mdbook build book
      - name: assemble site
        run: |
          mkdir -p site
          cp -r book/book/. site/
      - name: download coverage report
        uses: actions/download-artifact@v4
        with:
          name: fuzz-coverage-report
          path: site/fuzz-coverage/
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
